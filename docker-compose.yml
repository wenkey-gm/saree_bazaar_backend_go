version: "3.9"
services:
  web:
    container_name: web
    depends_on:
      - mongo
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      MONGO_URI: mongodb://mongo:27017
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      # Emails allowed to manage the catalog at http://localhost:8080/admin
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - saree_uploads:/data/uploads
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - 27017:27017
    volumes:
      - mongodb_data_container:/data/db

volumes:
  mongodb_data_container:
  saree_uploads:
